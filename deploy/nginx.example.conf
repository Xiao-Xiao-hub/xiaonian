# Example host proxy for the API (D052). Not deployed anywhere; adjust
# api.example.com, the certificate paths and the admin allowlist first.
# Pairs with compose.production.example.yaml: the API listens on
# 127.0.0.1:8787 and trusts only this proxy's X-Forwarded-For.
# Check with: sudo nginx -t

# Per-client limits in front of the app's own ones.
limit_req_zone $binary_remote_addr zone=zhiye_req:10m rate=10r/s;
# A page can show dozens of formula images at once, one request each.
limit_req_zone $binary_remote_addr zone=zhiye_formula:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=zhiye_conn:10m;

upstream zhiye_api {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Works on nginx before 1.25.1 too; newer versions only warn it is deprecated.
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Photos are at most 5 MB plus multipart framing.
    client_max_body_size 6m;
    limit_conn zhiye_conn 20;
    # Locations without their own limit_req inherit this one.
    limit_req zone=zhiye_req burst=40 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: the app trusts this header as the client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Admin pages, admin API and metrics: only from trusted addresses.
    location ~ ^/(admin|v1/admin|metrics)(/|$) {
        allow 127.0.0.1;
        # allow 203.0.113.10;   # your office or VPN address
        deny all;
        proxy_pass http://zhiye_api;
    }

    # Ask-AI answers stream as server-sent events, possibly after trying a
    # backup model endpoint first, so give them several minutes, unbuffered.
    # Only file imports accept 10 MB plus multipart framing.
    location = /v1/imports/file {
        client_max_body_size 11m;
        proxy_pass http://zhiye_api;
    }

    location = /v1/chat/send {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://zhiye_api;
    }

    location /v1/formula/ {
        limit_req zone=zhiye_formula burst=200 nodelay;
        proxy_pass http://zhiye_api;
    }

    location /v1/assets/ {
        limit_req zone=zhiye_formula burst=200 nodelay;
        proxy_pass http://zhiye_api;
    }

    location / {
        proxy_pass http://zhiye_api;
    }
}
